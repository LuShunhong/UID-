name: Build UID- Module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.10+ 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装指定版本 Android NDK (27.3.13750724)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"

      - name: 4. 执行构建脚本
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          python tools/uid-seccomp-module/build.py --module-only

      - name: 5. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: UID-Seccomp-Module
          path: build/**/*.zip*
          if-no-files-found: error
