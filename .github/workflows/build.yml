name: Build UID- Module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.10+ 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装指定版本 Android NDK (27.3.13750724)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "NDK_DIR=$SDK_DIR/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: 4. 检查环境与构建脚本
        run: |
          echo "=== 检查 NDK 目录内容 ==="
          ls -la "$NDK_DIR"
          echo "=== 查看 build.py 如何检测 NDK ==="
          head -n 80 tools/uid-seccomp-module/build.py

      - name: 5. 执行构建脚本
        env:
          ANDROID_HOME: ${{ env.SDK_DIR }}
          ANDROID_SDK_ROOT: ${{ env.SDK_DIR }}
          ANDROID_NDK_HOME: ${{ env.NDK_DIR }}
        run: |
          python tools/uid-seccomp-module/build.py --module-only

      - name: 6. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: UID-Seccomp-Module
          path: build/**/*.zip*
          if-no-files-found: error
