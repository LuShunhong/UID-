name: Build UID- Module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest # 切换为云端 Windows 环境以匹配 build.py 中的 .exe 工具链

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装指定版本 Android NDK (27.3.13750724)
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = "C:\Android\android-sdk" }
          $sdkmanager = "$sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          
          # 接受协议并安装 Windows 版 NDK 27.3.13750724
          echo y | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;27.3.13750724"
          
          # 写入环境变量供后续步骤使用
          "ANDROID_NDK_HOME=$sdk\ndk\27.3.13750724" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 4. 执行构建脚本
        shell: pwsh
        run: |
          python tools/uid-seccomp-module/build.py --module-only

      - name: 5. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: UID-Seccomp-Module
          path: build/**/*.zip*
          if-no-files-found: error
